<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L'Atelier d'Elia</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #f6f1ea;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  padding: 20px 60px;
  background: white;
  border-bottom: 1px solid #eee;
}

.logo {
  font-family: 'Playfair Display';
  font-size: 22px;
}

nav a {
  margin: 0 15px;
  text-decoration: none;
  color: black;
  font-size: 13px;
  text-transform: uppercase;
}

.cart {
  background: #c89b5e;
  color: white;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
}

/* TITRES */
h1 {
  text-align: center;
  font-family: 'Playfair Display';
  margin-top: 40px;
}

h2 {
  text-align: center;
  color: #c89b5e;
}

/* PRODUITS */
.products {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 40px;
}

.product {
  width: 180px;
  text-align: center;
  cursor: pointer;
}

.product img {
  width: 100%;
  border-radius: 8px;
  transition: 0.3s;
}

.product:hover img {
  transform: scale(1.05);
}

/* PANIER */
#cartBox {
  position: fixed;
  right: 20px;
  top: 90px;
  width: 280px;
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  display: none;
}

.item {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.item img {
  width: 40px;
  border-radius: 5px;
}

button {
  background: #c89b5e;
  color: white;
  border: none;
  padding: 8px;
  width: 100%;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div class="logo">L'Atelier d'Elia</div>

  <nav>
    <a href="#">Accueil</a>
    <a href="#">Boutique</a>
    <a href="#">Contact</a>
  </nav>

  <div class="cart" onclick="toggleCart()">
    Panier : <span id="count">0</span>
  </div>
</header>

<h1>Dernière collection</h1>
<h2>Découvrez les nouveautés</h2>

<div class="products">

  <div class="product" onclick="addToCart('Colombe', 29, 'https://via.placeholder.com/150')">
    <img src="https://via.placeholder.com/150">
    <p>Colombe</p>
  </div>

  <div class="product" onclick="addToCart('Adoration', 39, 'https://via.placeholder.com/150')">
    <img src="https://via.placeholder.com/150">
    <p>Adoration</p>
  </div>

</div>

<!-- PANIER -->
<div id="cartBox">
  <h3>Panier</h3>
  <div id="items"></div>
</div>

<script>
let cart = [];

function addToCart(name, price, img){

  cart.push({name, price, img});
  updateCart();
}

function updateCart(){

  document.getElementById("count").textContent = cart.length;

  let box = document.getElementById("items");
  box.innerHTML = "";

  cart.forEach(p => {
    box.innerHTML += `
      <div class="item">
        <img src="${p.img}">
        <div>${p.name} - ${p.price}€</div>
      </div>
    `;
  });
}

function toggleCart(){
  let box = document.getElementById("cartBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
