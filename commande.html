<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande - L'Atelier d'Elia</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background-color:#f6f1ea;
  font-family:'Montserrat',sans-serif;
  color:#2d2d2d;
}

header, footer {
  background:#fff;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

.logo {
  font-family:'Playfair Display',serif;
  font-size:24px;
}

h1,h2 {
  text-align:center;
}

h1 {
  font-size:36px;
  margin-top:40px;
}

h2 {
  color:#c89b5e;
  margin-bottom:20px;
}

.cart-table {
  width:90%;
  max-width:800px;
  margin:0 auto 20px;
  border-collapse:collapse;
}

.cart-table th, .cart-table td {
  border-bottom:1px solid #ddd;
  padding:10px;
  text-align:center;
}

.cart-table img {
  width:50px;
  border-radius:5px;
}

input[type="text"], input[type="email"], textarea {
  width:90%;
  padding:10px;
  margin-bottom:15px;
  border-radius:5px;
  border:1px solid #ccc;
}

textarea {resize:vertical;}

button {
  background:#c89b5e;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:30px;
  cursor:pointer;
  font-size:16px;
}

#promoRow {
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:10px;
}

#total {
  font-weight:bold;
  font-size:18px;
  text-align:right;
  margin-right:5%;
}

#details {
  text-align:right;
  margin-right:5%;
  font-size:14px;
  color:#444;
}
</style>
</head>

<body>

<header>
  <div class="logo">L'Atelier d'Elia</div>
</header>

<main>

<h1>Votre commande</h1>
<h2>Checkout automatique</h2>

<table class="cart-table" id="cartTable">
  <thead>
    <tr>
      <th>Image</th>
      <th>Article</th>
      <th>Prix</th>
      <th>Quantité</th>
      <th>Sous-total</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="promoRow">
  <input type="text" id="promoCode" placeholder="Code promo">
  <button onclick="applyPromo()">Appliquer</button>
</div>

<div id="details"></div>
<div id="total">Total : 0€</div>

<h2>Informations de livraison</h2>

<form>
  <input type="text" id="firstName" placeholder="Prénom" required><br>
  <input type="text" id="lastName" placeholder="Nom" required><br>
  <input type="email" id="email" placeholder="Email" required><br>
  <input type="text" id="address" placeholder="Adresse" required><br>
  <textarea id="comment" rows="4" placeholder="Commentaire"></textarea><br>
  <button type="button" onclick="submitOrder()">Finaliser la commande</button>
</form>

</main>

<footer style="text-align:center; padding:20px;">
  <p>&copy; 2026 L'Atelier d'Elia</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("dc3TyqsgD03Ugf4_8");

// ================= DATA =================
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let total = 0;
let discount = 0;

// ================= POIDS =================
function calculateWeight() {
  let weight = 0;

  cart.forEach(item => {
    const qty = item.quantity || 0;

    if (item.type === "carte") weight += qty * 10;
    if (item.type === "sticker") weight += qty * 5;
  });

  return weight;
}

// ================= LIVRAISON =================
function calculateShipping(weight) {
  if (weight <= 20) return 1.55;
  if (weight <= 100) return 3.10;
  if (weight <= 250) return 5.25;
  if (weight <= 500) return 7.45;
  if (weight <= 1000) return 9.30;
  if (weight <= 2000) return 11.15;
  return 0;
}

// ================= PANIER =================
function renderCart() {
  const tbody = document.querySelector('#cartTable tbody');
  tbody.innerHTML = '';
  total = 0;

  cart.forEach(item => {
    const subtotal = item.price * item.quantity;
    total += subtotal;

    tbody.innerHTML += `
      <tr>
        <td><img src="${item.imgSrc}" width="50"></td>
        <td>${item.name}</td>
        <td>${item.price}€</td>
        <td>${item.quantity}</td>
        <td>${subtotal.toFixed(2)}€</td>
      </tr>
    `;
  });

  updateDisplay();
}

// ================= DISPLAY LIVE =================
function updateDisplay() {
  const weight = calculateWeight();
  const shipping = calculateShipping(weight);

  const finalTotal = total - discount + shipping;

  document.getElementById('details').innerHTML =
    `Poids total : ${weight} g | Livraison : ${shipping.toFixed(2)} €`;

  document.getElementById('total').innerHTML =
    `Total : ${finalTotal.toFixed(2)} €`;
}

// ================= PROMO =================
function applyPromo() {
  const code = document.getElementById('promoCode').value.trim();

  if (code === "PROMO10") {
    discount = total * 0.10;
    alert("Promo 10% appliquée !");
  } else {
    discount = 0;
    if (code) alert("Code invalide");
  }

  updateDisplay();
}

// ================= ORDER =================
function submitOrder() {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();
  const comment = document.getElementById('comment').value.trim();

  if (!firstName || !lastName || !email || !address) {
    alert("Remplis tous les champs");
    return;
  }

  let panierTexte = "";
  cart.forEach(item => {
    panierTexte += `${item.name} x${item.quantity}\n`;
  });

  const weight = calculateWeight();
  const shipping = calculateShipping(weight);
  const finalTotal = (total - discount + shipping).toFixed(2);

  const templateParams = {
    prenom: firstName,
    nom: lastName,
    email_client: email,
    adresse: address,
    commentaire: comment,
    panier: panierTexte,
    poids: weight + "g",
    livraison: shipping + "€",
    total: finalTotal + "€"
  };

  emailjs.send('service_9fdb3is','template_72wi0b9', templateParams)
    .then(() => {
      alert("Commande envoyée !");
      localStorage.setItem('totalCommande', finalTotal);
      localStorage.removeItem('cart');
      window.location.href = "payement.html";
    })
    .catch(err => {
      console.log(err);
      alert("Erreur d'envoi");
    });
}

renderCart();
</script>

</body>
</html>
