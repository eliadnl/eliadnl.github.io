<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande - L'Atelier d'Elia</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background-color:#f6f1ea;
  font-family:'Montserrat',sans-serif;
  color:#2d2d2d;
}

header, footer {
  background:#fff;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

.logo {
  font-family:'Playfair Display',serif;
  font-size:24px;
}

h1,h2 {
  text-align:center;
}

h1 {
  font-size:36px;
  margin-top:40px;
}

h2 {
  color:#c89b5e;
  margin-bottom:20px;
}

.cart-table {
  width:90%;
  max-width:800px;
  margin:0 auto 20px;
  border-collapse:collapse;
}

.cart-table th, .cart-table td {
  border-bottom:1px solid #ddd;
  padding:10px;
  text-align:center;
}

.cart-table img {
  width:50px;
  border-radius:5px;
}

input, textarea {
  width:90%;
  padding:10px;
  margin-bottom:15px;
  border-radius:5px;
  border:1px solid #ccc;
}

button {
  background:#c89b5e;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:30px;
  cursor:pointer;
}

#total {
  font-weight:bold;
  font-size:18px;
  text-align:right;
  margin-right:5%;
}

#details {
  text-align:right;
  margin-right:5%;
  font-size:14px;
  color:#444;
}
</style>
</head>

<body>

<header>
  <div class="logo">L'Atelier d'Elia</div>
</header>

<main>

<h1>Votre commande</h1>
<h2>Checkout automatique</h2>

<table class="cart-table">
  <thead>
    <tr>
      <th>Image</th>
      <th>Article</th>
      <th>Prix</th>
      <th>Quantité</th>
      <th>Sous-total</th>
    </tr>
  </thead>
  <tbody id="cartTable"></tbody>
</table>

<div id="details"></div>
<div id="total">Total : 0€</div>

<h2>Informations</h2>

<input type="text" id="firstName" placeholder="Prénom">
<input type="text" id="lastName" placeholder="Nom">
<input type="email" id="email" placeholder="Email">
<input type="text" id="address" placeholder="Adresse">
<textarea id="comment" placeholder="Message"></textarea>

<button onclick="submitOrder()">Commander</button>

</main>

<footer style="text-align:center;padding:20px;">
  <p>&copy; 2026 L'Atelier d'Elia</p>
</footer>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let total = 0;
let discount = 0;

// ---------------- POIDS (FIX DEFINITIF) ----------------
function calculateWeight() {
  let weight = 0;

  cart.forEach(item => {
    const name = (item.name || "").toLowerCase();
    const qty = item.quantity || 0;

    if (name.includes("carte")) {
      weight += qty * 10;
    }

    if (name.includes("sticker")) {
      weight += qty * 5;
    }
  });

  return weight;
}

// ---------------- LIVRAISON ----------------
function calculateShipping(weight) {
  if (weight <= 20) return 1.55;
  if (weight <= 100) return 3.10;
  if (weight <= 250) return 5.25;
  if (weight <= 500) return 7.45;
  if (weight <= 1000) return 9.30;
  if (weight <= 2000) return 11.15;
  return 0;
}

// ---------------- AFFICHAGE PANIER ----------------
function renderCart() {
  const tbody = document.getElementById("cartTable");
  tbody.innerHTML = "";
  total = 0;

  cart.forEach(item => {
    const subtotal = item.price * item.quantity;
    total += subtotal;

    tbody.innerHTML += `
      <tr>
        <td><img src="${item.imgSrc}" width="50"></td>
        <td>${item.name}</td>
        <td>${item.price}€</td>
        <td>${item.quantity}</td>
        <td>${subtotal.toFixed(2)}€</td>
      </tr>
    `;
  });

  updateDisplay();
}

// ---------------- UPDATE GLOBAL ----------------
function updateDisplay() {
  const weight = calculateWeight();
  const shipping = calculateShipping(weight);
  const finalTotal = total + shipping - discount;

  document.getElementById("details").innerHTML =
    "Poids total : " + weight + " g | Livraison : " + shipping.toFixed(2) + " €";

  document.getElementById("total").innerHTML =
    "Total : " + finalTotal.toFixed(2) + " €";
}

// ---------------- COMMANDE ----------------
function submitOrder() {
  const weight = calculateWeight();
  const shipping = calculateShipping(weight);
  const finalTotal = total + shipping - discount;

  alert(
    "Commande OK\nPoids: " + weight + "g\nTotal: " + finalTotal.toFixed(2) + "€"
  );
}

renderCart();
</script>

</body>
</html>
