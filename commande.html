<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande - L'Atelier d'Elia</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#f6f1ea;
  font-family:'Montserrat',sans-serif;
  color:#2d2d2d;
}

/* HEADER */
header {
  background:#fff;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-family:'Playfair Display';
  font-size:24px;
}

.header-right {
  display:flex;
  gap:10px;
  align-items:center;
}

button {
  background:#c89b5e;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
}

.close {
  font-size:22px;
  cursor:pointer;
}

/* TABLE */
table {
  width:90%;
  margin:auto;
  border-collapse:collapse;
}

th,
td {
  border-bottom:1px solid #ddd;
  padding:10px;
  text-align:center;
}

img {
  width:60px;
  border-radius:5px;
}

.delete {
  color:red;
  cursor:pointer;
  font-size:18px;
}

/* FORM */
input,
textarea {
  width:90%;
  margin:10px auto;
  padding:10px;
  display:block;
}
</style>
</head>

<body>

<header>
  <div class="logo">L'Atelier d'Elia</div>

  <div class="header-right">
    <button onclick="window.location.href='index.html'">
      Continuer le shopping
    </button>

    <div class="close" onclick="window.location.href='index.html'">
      ✖
    </div>
  </div>
</header>

<main>

<h2 style="text-align:center;">Votre commande</h2>

<table>
  <thead>
    <tr>
      <th>Image</th>
      <th>Article</th>
      <th>Prix</th>
      <th>Qté</th>
      <th>Total</th>
      <th></th>
    </tr>
  </thead>

  <tbody id="cartBody"></tbody>
</table>

<div id="info" style="text-align:right;margin-right:5%;"></div>

<div id="total" style="text-align:right;margin-right:5%;font-weight:bold;"></div>

<h3 style="text-align:center;">Infos client</h3>

<input id="firstName" placeholder="Prénom">
<input id="lastName" placeholder="Nom">
<input id="email" placeholder="Email">
<input id="address" placeholder="Adresse">

<textarea id="comment" placeholder="Message"></textarea>

<div style="text-align:center;">
  <button onclick="submitOrder()">Commander</button>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("dc3TyqsgD03Ugf4_8");

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

// ---------------- POIDS ----------------

function weightCalc() {

  let w = 0;

  cart.forEach(i => {

    const n = i.name.toLowerCase();

    if(n.includes("carte")) w += i.quantity * 10;
    if(n.includes("sticker")) w += i.quantity * 5;

  });

  return w;
}

// ---------------- LIVRAISON ----------------

function shippingCalc(w) {

  if(w <= 20) return 1.55;
  if(w <= 100) return 3.10;
  if(w <= 250) return 5.25;
  if(w <= 500) return 7.45;
  if(w <= 1000) return 9.30;
  if(w <= 2000) return 11.15;

  return 0;
}

// ---------------- RENDER ----------------

function render() {

  const body = document.getElementById("cartBody");

  body.innerHTML = "";

  total = 0;

  cart.forEach((i,index) => {

    let sub = i.price * i.quantity;

    total += sub;

    body.innerHTML += `
      <tr>
        <td><img src="${i.imgSrc}"></td>
        <td>${i.name}</td>
        <td>${i.price}€</td>
        <td>${i.quantity}</td>
        <td>${sub.toFixed(2)}€</td>
        <td>
          <span class="delete" onclick="remove(${index})">✖</span>
        </td>
      </tr>
    `;

  });

  update();
}

// ---------------- DELETE ----------------

function remove(i) {

  cart.splice(i,1);

  localStorage.setItem("cart", JSON.stringify(cart));

  render();
}

// ---------------- UPDATE ----------------

function update() {

  let w = weightCalc();

  let ship = shippingCalc(w);

  let final = total + ship;

  document.getElementById("info").innerHTML =
    "Poids : " + w + "g | Livraison : " + ship.toFixed(2) + "€";

  document.getElementById("total").innerHTML =
    "Total : " + final.toFixed(2) + "€";
}

// ---------------- ORDER ----------------

function submitOrder() {

  let w = weightCalc();

  let ship = shippingCalc(w);

  let final = total + ship;

  let list = "";

  cart.forEach(i => {

    list += i.name + " x" + i.quantity + "\n";

  });

  let params = {

    prenom: document.getElementById("firstName").value,
    nom: document.getElementById("lastName").value,
    email_client: document.getElementById("email").value,
    adresse: document.getElementById("address").value,
    commentaire: document.getElementById("comment").value,
    panier: list,
    poids: w + "g",
    livraison: ship + "€",
    total: final + "€"

  };

  // EMAIL ADMIN

  emailjs.send(
    "service_9fdb3is",
    "template_admin",
    params
  );

  // EMAIL CLIENT

  emailjs.send(
    "service_9fdb3is",
    "template_client",
    params
  );

  alert("Commande envoyée !");

  localStorage.removeItem("cart");

  window.location.href = "payement.html";
}

render();

</script>

</body>
</html>
